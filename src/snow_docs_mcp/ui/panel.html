<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ServiceNow Docs</title>
<style>
/* One self-contained page: the host's sandbox allows nothing external. Colors and type come
   from the host's standard variables when it sends them; the values here are the fallback.

   Type: three sizes for text (12 meta, 14 secondary, 16 body) and one for the title (20),
   three weights (400, 500, 600). Space: a 4/8 grid (4, 8, 12, 16, 24, 32). Nothing is there
   for decoration: color appears only where it tells the two releases apart, and never alone. */
:root {
  color-scheme: light dark;
  --bg: var(--color-background-primary, light-dark(#ffffff, #1f1e1d));
  --bg-quiet: var(--color-background-secondary, light-dark(#f6f5f1, #282725));
  --ink: var(--color-text-primary, light-dark(#1b1b19, #f2f1ed));
  --ink-2: var(--color-text-secondary, light-dark(#5c5b56, #b4b2aa));
  --line: var(--color-border-primary, light-dark(#e3e1da, #3b3a36));
  --ring: var(--color-ring-primary, light-dark(#1f6feb, #8ab4ff));
  --sans: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
  --mono: var(--font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace);
  /* Text quoted from the docs is set in a reading face, so source and interface never blur. */
  --serif: "Iowan Old Style", Charter, "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  /* The two releases keep one color each, in the comparison only. */
  --au: light-dark(#8a5300, #efb35c);
  --au-wash: light-dark(#fbefd9, #3a2c12);
  --br: light-dark(#136c3b, #7ad39b);
  --br-wash: light-dark(#e0f4e7, #15331f);
  --radius: var(--border-radius-md, 8px);
  --radius-sm: var(--border-radius-sm, 6px);
  --meta: 0.75rem; --secondary: 0.875rem; --body: 1rem; --title: 1.25rem;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s6: 24px; --s8: 32px;
  --prose: 68ch;
}
* { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; padding: var(--s4) var(--s6) var(--s6);
  background: var(--bg); color: var(--ink);
  font: 400 var(--body)/1.55 var(--sans); font-feature-settings: "kern", "liga", "calt";
  text-rendering: optimizeLegibility; overflow-wrap: break-word;
}
h1, h2, h3, h4, p, ol, ul, blockquote, figure { margin: 0; padding: 0; }
ol, ul { list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: var(--radius-sm); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
[hidden] { display: none !important; }

/* Head: what was asked, how much came back, and which release it is from. */
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--s3) var(--s6);
  padding-bottom: var(--s4); border-bottom: 1px solid var(--line); }
.head-text { flex: 1 1 16rem; min-width: 0; }
.head h1 { font: 600 var(--title)/1.2 var(--sans); text-wrap: balance; }
.head .count { margin-top: var(--s1); color: var(--ink-2); font-size: var(--secondary); line-height: 1.4; }
/* The way to the other release is one quiet button on the line that names the release shown.
   It is underlined text, so it reads as something to press without color or a box. */
.count { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: var(--s3); }
/* Padding makes it easier to hit; the same margin taken back keeps the line as high as its text. */
.switch { padding: var(--s1) 0; margin: calc(var(--s1) * -1) 0; color: var(--ink-2); font: 400 var(--secondary)/1.4 var(--sans);
  text-decoration: underline; text-decoration-color: var(--ink-2); text-underline-offset: 2px; }
.switch:hover { color: var(--ink); text-decoration-color: var(--ink); }
.switch[aria-busy="true"] { opacity: 0.55; cursor: progress; }
.legend { display: flex; gap: var(--s4); color: var(--ink-2); font-size: var(--secondary); line-height: 1.4; }
.key { display: inline-block; width: 8px; height: 8px; margin-right: var(--s2); border-radius: 2px; }
.key.australia { background: var(--au); } .key.brazil { background: var(--br); }

/* A tree of closed rows. A product area or a page holds its hits or sections; a row opens in
   place to the passage and what can be done with it. Every row is one line, 32px high. */
.tree > li { padding: var(--s1) 0; border-bottom: 1px solid var(--line); }
.fold { display: flex; align-items: baseline; gap: var(--s2); width: 100%; padding: var(--s1) 0; font: 500 var(--body)/1.5rem var(--sans); }
h2 > .fold { font: 600 var(--secondary)/1.5rem var(--sans); }
.fold .chev { flex: none; align-self: flex-start; width: 16px; height: 1.5rem; color: var(--ink-2); }
.fold[aria-expanded="true"] > .chev { transform: rotate(90deg); }
.fold-text { flex: 1 1 auto; min-width: 0; }
.fold:hover .fold-name { text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--ink-2); }
.fold-count { color: var(--ink-2); font: 400 var(--secondary)/1.5rem var(--sans); }
/* Smaller words on the name's own line: they take its line height, so every row is as high. */
.fold-more, .fold .kind { margin-left: var(--s1); color: var(--ink-2); font: 400 var(--secondary)/1 var(--sans); }
.fold-count { flex: none; font-variant-numeric: tabular-nums; }
/* The rank the search gave the hit: it stays with the hit, whichever area the hit stands in. */
.fold .rank { flex: none; width: 2ch; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.leaves, .branch-body { padding-left: var(--s6); }
.branch-body > .leaves { padding-left: 0; }
/* What a row opens to starts under the row's name: past the arrow, and past the rank if it has one. */
.fold-body { padding: var(--s1) 0 var(--s4) var(--s6); }
.ranked > .fold-body { padding-left: calc(var(--s8) + 2ch); }
.where { margin-top: var(--s1); color: var(--ink-2); font-size: var(--secondary); line-height: 1.4; }
.quote { max-width: var(--prose); font: 400 var(--body)/1.55 var(--serif); }
.acts { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s3); }
.act { min-height: 32px; padding: var(--s1) var(--s3); border: 1px solid var(--line); border-radius: var(--radius-sm);
  font: 500 var(--secondary)/1.4 var(--sans); }
.act:hover { background: var(--bg-quiet); }
.act[aria-expanded="true"] { background: var(--bg-quiet); border-color: var(--ink-2); }
.act[aria-busy="true"] { opacity: 0.55; cursor: progress; }

/* Reader: the full section, opened in place, under a line that says which one it is. */
.reader { margin-top: var(--s4); border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-quiet); }
.reader-head { padding: var(--s2) var(--s6); border-bottom: 1px solid var(--line); font: 500 var(--meta)/1.4 var(--sans); color: var(--ink-2); }
.reader-body { max-height: 28rem; overflow: auto; padding: var(--s4) var(--s6); }
.reader-note { padding: var(--s2) var(--s6); border-top: 1px solid var(--line); color: var(--ink-2); font-size: var(--secondary); line-height: 1.4; }

/* Text from the docs: headings, paragraphs, lists inside lists, tables and code. */
.prose { font: 400 var(--body)/1.55 var(--serif); min-width: 0; }
.prose > * + * { margin-top: var(--s3); }
.prose h2, .prose h3, .prose h4 { font: 600 var(--body)/1.25 var(--sans); margin-top: var(--s6); scroll-margin-top: var(--s4); }
.doc-body > h2 { font: 600 var(--title)/1.2 var(--sans); margin-top: var(--s8); }
.prose > h2:first-child, .prose > h3:first-child, .prose > h4:first-child { margin-top: 0; }
.prose p, .prose li { max-width: var(--prose); }
.prose ul, .prose ol { padding-left: var(--s6); } .prose ul { list-style: disc; } .prose ol { list-style: decimal; }
.prose ol ol { list-style: lower-alpha; } .prose ol ol ol { list-style: lower-roman; }
.prose li + li { margin-top: var(--s2); }
.prose li > * + *, .prose td > * + *, .prose th > * + * { margin-top: var(--s2); }
.prose code { font: 400 var(--secondary)/1.4 var(--mono); padding: 0 var(--s1); border-radius: 4px; background: color-mix(in oklab, var(--ink) 9%, transparent); }
.prose pre { overflow: auto; max-width: none; padding: var(--s3) var(--s4); border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: color-mix(in oklab, var(--ink) 4%, transparent); font: 400 var(--secondary)/1.5 var(--mono); }
.prose pre code { padding: 0; background: none; }
.prose table { border-collapse: collapse; font: 400 var(--secondary)/1.5 var(--sans); width: 100%; }
.prose th, .prose td { padding: var(--s2) var(--s3); border: 1px solid var(--line); text-align: left; vertical-align: top; }
.prose th { font-weight: 600; background: color-mix(in oklab, var(--ink) 5%, transparent); }
.prose a { color: inherit; text-decoration: underline; text-decoration-color: var(--ink-2); text-underline-offset: 2px; }
.prose .act { margin-top: var(--s2); }
.callout { padding: var(--s3) var(--s4); border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--bg-quiet); max-width: var(--prose); }
.callout strong { display: block; font: 600 var(--secondary)/1.4 var(--sans); margin-bottom: var(--s1); }
.table-wrap { overflow-x: auto; }

/* Compare: Australia beside Brazil. The words only one of them has are marked: struck through
   in Australia, underlined in Brazil, each on its release's wash. */
.part { margin-top: var(--s4); }
.part > h2 { font: 600 var(--secondary)/1.4 var(--sans); color: var(--ink-2); padding-bottom: var(--s2); border-bottom: 1px solid var(--line); }
.page { padding: var(--s4) 0; border-bottom: 1px solid var(--line); }
.page > h3 { font: 600 var(--secondary)/1.4 var(--sans); }
.fold .kind.added { color: var(--br); } .fold .kind.removed { color: var(--au); }
.sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: var(--s4); }
.side { border: 1px solid var(--line); border-radius: var(--radius); }
.side .rel { display: block; padding: var(--s2) var(--s4); border-bottom: 1px solid var(--line); font: 500 var(--meta)/1.4 var(--sans); color: var(--ink-2); }
.side p { padding: var(--s3) var(--s4) var(--s4); font: 400 var(--body)/1.55 var(--serif); }
del, ins { border-radius: 2px; font-weight: 600; text-decoration-thickness: 1px; }
del { background: var(--au-wash); color: var(--au); text-decoration: line-through; }
ins { background: var(--br-wash); color: var(--br); text-decoration: underline; text-underline-offset: 2px; }
.names { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s3); }
.foot { margin-top: var(--s4); color: var(--ink-2); font-size: var(--secondary); line-height: 1.4; }
.foot p + p { margin-top: var(--s1); }

/* A page as a document: the text in a reading column, its sections listed beside it. */
.doc-acts[hidden] { display: none; }
.doc { margin-top: var(--s4); }
.doc.with-toc { display: grid; grid-template-columns: minmax(0, 1fr) 14rem; gap: var(--s8); align-items: start; }
.doc.with-toc .toc { grid-column: 2; grid-row: 1; max-height: 32rem; overflow: auto; }
/* The text scrolls inside the panel, so a long page takes no more of the conversation than a
   short one, and the list of its sections stays beside it. */
.doc-body { max-height: 32rem; overflow: auto; padding: var(--s1) var(--s4) var(--s1) var(--s1); }
.doc.with-toc .doc-body { grid-column: 1; grid-row: 1; }
.doc.with-toc .reader-note { grid-column: 1; }
.toc h2 { font: 600 var(--secondary)/1.4 var(--sans); color: var(--ink-2); margin-bottom: var(--s2); }
.toc li { font-size: var(--secondary); line-height: 1.4; } .toc li + li { margin-top: var(--s2); } .toc li.sub { padding-left: var(--s3); }
.toc a { color: var(--ink-2); text-decoration: none; } .toc a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }

/* Browsing: where you are, then folders and pages as rows. */
.trail { display: flex; flex-wrap: wrap; align-items: baseline; margin-top: var(--s4); color: var(--ink-2); font-size: var(--secondary); line-height: 1.4; }
.trail button { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 2px; }
.trail button:hover { color: var(--ink); text-decoration-color: var(--ink-2); }
.trail .sep { margin: 0 var(--s2); } .trail [aria-current] { color: var(--ink); }
/* A long listing scrolls inside the panel. The focus ring is drawn inside the row, where the
   edge of the scrolling box cannot cut it. */
.rows { max-height: 25rem; overflow: auto; }
.rows > li { border-bottom: 1px solid var(--line); }
.row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s4); width: 100%; padding: var(--s1) 0; line-height: 1.5rem; }
.row:focus-visible { outline-offset: -2px; }
.row:hover .row-name { text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--ink-2); }
.row-count { flex: none; color: var(--ink-2); font-size: var(--secondary); font-variant-numeric: tabular-nums; }

/* Diagrams: neutral boxes and lines; the shape says what kind of step it is. */
.chart-wrap { margin-top: var(--s4); overflow-x: auto; }
.chart { display: block; max-width: none; height: auto; font: 400 var(--secondary) var(--sans); }
.chart .node rect, .chart .node polygon { fill: var(--bg-quiet); stroke: var(--ink-2); stroke-width: 1; }
.chart .node.start rect, .chart .node.end rect { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.chart .node text { fill: var(--ink); }
.chart .node[role="button"] { cursor: pointer; }
.chart .node[role="button"]:hover rect, .chart .node[role="button"]:hover polygon { stroke: var(--ink); }
.chart .node:focus-visible { outline: none; } .chart .node:focus-visible rect, .chart .node:focus-visible polygon { stroke: var(--ring); stroke-width: 2; }
.chart .link { fill: none; stroke: var(--ink-2); stroke-width: 1.25; }
.chart .tip { fill: var(--ink-2); }
/* A link's name is cut out of whatever line passes under it. */
.chart .link-name { fill: var(--ink-2); font-size: var(--meta); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.chart .lane-name { fill: var(--ink-2); font-weight: 500; }
.chart .lane-line { stroke: var(--line); stroke-width: 1; }
.entry[tabindex]:focus-visible, h1:focus-visible { outline-offset: 4px; }

/* States */
.state { padding: var(--s6) 0; color: var(--ink-2); font-size: var(--secondary); }
.state strong { display: block; color: var(--ink); font-size: var(--body); font-weight: 600; margin-bottom: var(--s1); }
.notice { margin-top: var(--s3); padding: var(--s2) var(--s3); border-radius: var(--radius-sm); background: var(--bg-quiet); border: 1px solid var(--line); font: 400 var(--secondary)/1.4 var(--sans); }
.pulse { display: inline-block; width: 8px; height: 8px; margin-right: var(--s2); border-radius: 50%; background: var(--ink-2); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }
@media (max-width: 44rem) { .doc.with-toc { display: block; } .doc.with-toc .toc { max-height: 12rem; margin-bottom: var(--s6); padding-bottom: var(--s4); border-bottom: 1px solid var(--line); } }
@media (max-width: 30rem) { body { padding: var(--s3) var(--s4) var(--s4); } .ranked > .fold-body { padding-left: var(--s6); }
  .reader-body, .reader-head, .reader-note { padding-left: var(--s4); padding-right: var(--s4); } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } * { scroll-behavior: auto !important; } }
@media (forced-colors: active) {
  .key { forced-color-adjust: none; } .act, .side, .reader { border-color: CanvasText; }
  .chart .node rect, .chart .node polygon { fill: Canvas; stroke: CanvasText; } .chart .link { stroke: CanvasText; }
  .chart .tip, .chart text { fill: CanvasText; } .chart .link-name { stroke: Canvas; }
}
</style>
</head>
<body>
<main>
<div id="app"></div>
<div id="live" class="sr" role="status" aria-live="polite"></div>
</main>
<script>
(() => {
"use strict";

// ---- words -------------------------------------------------------------------------------
const WORDS = {
  en: {
    searching: "Searching the docs…", comparing: "Comparing Australia and Brazil…", reading: "Reading…", opening: "Opening…",
    passages: (n) => (n === 1 ? "1 passage" : n + " passages"), fromDocs: (r) => "from the " + r + " docs",
    snapshot: (d) => "snapshot " + d, switchTo: (r) => "Switch to " + r, read: "Read section", hide: "Hide section",
    open: "Open docs", readPage: "Read page", noHits: "No passages matched", tryOther: "Try other words, or search without a product area.",
    failed: "Something went wrong", cut: "This section is cut short. Open the docs page for the rest.",
    stoppedSearch: "The search was stopped", stoppedCompare: "The comparison was stopped", stoppedOpen: "Opening was stopped", stoppedDiagram: "The diagram was stopped",
    linkBlocked: (u) => "Could not open the link. Copy it: " + u, outside: "ServiceNow Docs",
    outsideHint: "This panel shows search results when Claude uses the ServiceNow docs tools.",
    whatChanged: "What changed from Australia to Brazil", notes: "Release notes", moreNotes: "More release notes by name",
    changedDocs: "Changed in the documentation", noChanges: "No changes found in the documentation pages on this topic.",
    added: "Added", removed: "Removed", changed: "Changed", rewording: "Small rewording",
    leftOut: (n) => (n === 1 ? "1 more section is not shown." : n + " more sections are not shown."),
    onlyIn: (r, n) => (n === 1 ? "1 page is only in the " + r + " docs." : n + " pages are only in the " + r + " docs."),
    readIn: (r) => "Read in " + r, hideIn: (r) => "Hide " + r + " section",
    onThisPage: "On this page", back: "Back", docs: "Docs", areas: "Product areas", folders: "Folders", pages: "Pages",
    nFolders: (n) => (n === 1 ? "1 folder" : n + " folders"), nPages: (n) => (n === 1 ? "1 page" : n + " pages"),
    nSections: (n) => (n === 1 ? "1 section" : n + " sections"),
    more: (n) => "Show " + n + " more", moreFailed: "Could not load more pages", showFlow: "Show as flow", hideFlow: "Hide flow", stepsTitle: "Steps",
    nSteps: (n) => (n === 1 ? "1 step" : n + " steps"), inLanes: (n) => "in " + n + " lanes", leadsTo: "Then", source: "Read source", hideSource: "Hide source",
    start: "Start", end: "End", decision: "Decision", flowOf: (s) => "Flow: " + s, loadingPage: "Opening the page…",
  },
  nb: {
    searching: "Søker i dokumentasjonen…", comparing: "Sammenligner Australia og Brazil…", reading: "Leser…", opening: "Åpner…",
    passages: (n) => (n === 1 ? "1 avsnitt" : n + " avsnitt"), fromDocs: (r) => "fra dokumentasjonen for " + r,
    snapshot: (d) => "øyeblikksbilde " + d, switchTo: (r) => "Bytt til " + r, read: "Les seksjonen", hide: "Skjul seksjonen",
    open: "Åpne dokumentasjonen", readPage: "Les siden", noHits: "Ingen treff", tryOther: "Prøv andre ord, eller søk uten produktområde.",
    failed: "Noe gikk galt", cut: "Seksjonen er kuttet. Åpne siden i dokumentasjonen for resten.",
    stoppedSearch: "Søket ble stoppet", stoppedCompare: "Sammenligningen ble stoppet", stoppedOpen: "Åpningen ble stoppet", stoppedDiagram: "Diagrammet ble stoppet",
    linkBlocked: (u) => "Kunne ikke åpne lenken. Kopier den: " + u, outside: "ServiceNow Docs",
    outsideHint: "Dette panelet viser søketreff når Claude bruker verktøyene for ServiceNow-dokumentasjonen.",
    whatChanged: "Hva som er endret fra Australia til Brazil", notes: "Release notes", moreNotes: "Flere release notes etter navn",
    changedDocs: "Endret i dokumentasjonen", noChanges: "Ingen endringer funnet i dokumentasjonssidene om dette temaet.",
    added: "Lagt til", removed: "Fjernet", changed: "Endret", rewording: "Liten omskriving",
    leftOut: (n) => (n === 1 ? "1 seksjon til vises ikke." : n + " seksjoner til vises ikke."),
    onlyIn: (r, n) => (n === 1 ? "1 side finnes bare i dokumentasjonen for " + r + "." : n + " sider finnes bare i dokumentasjonen for " + r + "."),
    readIn: (r) => "Les i " + r, hideIn: (r) => "Skjul seksjonen fra " + r,
    onThisPage: "På denne siden", back: "Tilbake", docs: "Dokumentasjon", areas: "Produktområder", folders: "Mapper", pages: "Sider",
    nFolders: (n) => (n === 1 ? "1 mappe" : n + " mapper"), nPages: (n) => (n === 1 ? "1 side" : n + " sider"),
    nSections: (n) => (n === 1 ? "1 seksjon" : n + " seksjoner"),
    more: (n) => "Vis " + n + " til", moreFailed: "Kunne ikke hente flere sider", showFlow: "Vis som flyt", hideFlow: "Skjul flyten", stepsTitle: "Steg",
    nSteps: (n) => n + " steg", inLanes: (n) => "i " + n + " baner", leadsTo: "Deretter", source: "Les kilden", hideSource: "Skjul kilden",
    start: "Start", end: "Slutt", decision: "Valg", flowOf: (s) => "Flyt: " + s, loadingPage: "Åpner siden…",
  },
};
let lang = "en";
const t = (key, ...args) => { const w = WORDS[lang][key] ?? WORDS.en[key]; return typeof w === "function" ? w(...args) : w; };
const RELEASES = ["australia", "brazil"];
const NAME = { australia: "Australia", brazil: "Brazil" };
const KINDS = ["added", "removed", "changed"];
const WEB = /^https?:\/\//i;

// ---- small DOM helpers (text only: nothing from a tool result is ever parsed as markup) ----
const app = document.getElementById("app");
const live = document.getElementById("live");
function el(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) node.append(kid);

      d = `M${rightOf(a, 8)} ${a.y - 8} H${a.x + W / 2 + 16} V${a.y + 8} H${rightOf(a, 8)}`; name = [a.x + W / 2 + 4, a.y - 12, "start"];
    } else if (l.kind === "down") {
      d = `${from} V${topOf(b, b.x)}`; name = [a.x + 8, a.y + a.h / 2 + 14, "start"];
    } else {
      const ty = gapY[a.row + 1] + l.out.at;
      if (l.kind === "step") {
        // across the gap under the step, then down into the next row; named beside the drop
        const dir = a.x < b.x ? -1 : 1, px = b.x + dir * PORT;
        d = `${from} V${ty} H${px} V${topOf(b, px)}`; name = [px + dir * 6, ty - 4, dir < 0 ? "end" : "start"];
      } else {
        // past other rows, or back up: along an alley, and into the step from above
        const vx = alleyX(l.alley) + l.via.at, iy = gapY[b.row] + l.into.at, px = b.x + (vx < b.x ? -PORT : PORT);
        d = `${from} V${ty} H${vx} V${iy} H${px} V${topOf(b, px)}`; name = [vx + (vx > a.x ? -6 : 6), ty - 4, vx > a.x ? "end" : "start"];
      }
    }
    root.append(svg("path", { d, class: "link", "marker-end": `url(#${tip})`, "aria-hidden": "true" }));
    if (l.label) names.push(svg("text", { x: name[0], y: name[1], class: "link-name", "text-anchor": name[2], "aria-hidden": "true", text: l.label }));
  }
  for (const st of steps) {
    const g = svg("g", { class: "node " + st.kind });
    const left = st.x - W / 2, top = st.y - st.h / 2;
    if (st.lines.cut) g.append(svg("title", { text: st.label }));
    if (st.kind === "decision") g.append(svg("polygon", { points: `${st.x},${top} ${left + W},${st.y} ${st.x},${top + st.h} ${left},${st.y}` }));
    else g.append(svg("rect", { x: left, y: top, width: W, height: st.h, rx: st.kind === "start" || st.kind === "end" ? st.h / 2 : 6 }));
    g.append(textOf(st.lines, st.x, st.y - ((st.lines.length - 1) * LINE) / 2 + 5));
    if (onPick) {
      g.setAttribute("tabindex", "0"); g.setAttribute("role", "button"); g.setAttribute("aria-label", st.label);
      g.addEventListener("click", () => onPick(st.id));
      g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onPick(st.id); } });
    }
    root.append(g);
  }
  root.append(...names); // last, so a name is never under a line or a shape
  // A figure wider than the panel scrolls sideways; then the keyboard can reach it to scroll.
  // With steps to pick, the frame is the named group and the svg holds its buttons (neither an
  // svg nor a figure can be a group). A plain one is an image; its frame is named only while
  // it scrolls.
  const figure = el("div", { class: "chart-wrap", ...(onPick ? { role: "group", "aria-label": label } : {}) }, root);
  new ResizeObserver(() => {
    const scrolls = figure.scrollWidth > figure.clientWidth + 1;
    const while_scrolling = onPick ? [["tabindex", "0"]] : [["tabindex", "0"], ["role", "group"], ["aria-label", label]];
    for (const [k, v] of while_scrolling) { if (scrolls) figure.setAttribute(k, v); else figure.removeAttribute(k); }
  }).observe(figure);
  return figure;
}
function showDiagram(result) {
  const lanes = result.lanes || [], steps = result.steps || [], links = result.links || [];
  const count = [t("nSteps", steps.length), lanes.length ? t("inLanes", lanes.length) : ""].filter(Boolean).join(" ");
  const head = el("header", { class: "head" }, el("div", { class: "head-text" }, title(result.title || t("stepsTitle")), el("p", { class: "count", text: count })));
  const items = new Map();
  const pick = (id) => { const li = items.get(id); if (!li) return; li.scrollIntoView({ block: "nearest", behavior: "smooth" }); focusOn(li.querySelector("button") || li); };
  const chart = diagram({ steps, links, lanes }, t("flowOf", result.title || ""), pick);
  const laneName = new Map(lanes.map((l) => [l.id, l.label]));
  const stepName = new Map(steps.map((st) => [st.id, st.label]));
  const outline = el("ol", { class: "entries" });
  steps.forEach((st, n) => {
    const li = el("li", { class: "entry", tabindex: "-1" }, el("span", { class: "rank", "aria-hidden": "true", text: String(n + 1) }), el("h3", { text: st.label }));
    const where = [st.kind !== "step" && WORDS.en[st.kind] ? t(st.kind) : "", laneName.get(st.lane) || ""].filter(Boolean).join(", ");
    if (where) li.append(el("p", { class: "where", text: where }));
    if (st.detail) li.append(el("blockquote", { class: "quote", text: st.detail }));
    const next = links.filter((l) => l.source === st.id).map((l) => (l.label ? l.label + ": " : "") + (stepName.get(l.target) || l.target));
    if (next.length) li.append(el("p", { class: "where", text: t("leadsTo") + " " + next.join("; ") }));
    if (st.source_id) li.append(el("div", { class: "acts" }, readerButton(st.source_id, t("source"), li, { hide: t("hideSource"), name: st.label })));
    items.set(st.id, li); outline.append(li);
  });
  app.replaceChildren(head, chart, el("section", { class: "part" }, el("h2", { text: t("stepsTitle") }), outline));
  say(result.title || t("stepsTitle"));
}

// ---- a page as a document ----------------------------------------------------------------
function documentBody(content, title) {
  // A page's text as a document, with its headings listed. A first heading that only repeats
  // the title is left out: the title is already the h1 above it.
  const anchors = [];
  // The text scrolls inside the panel, so the box takes the keyboard and says what it holds.
  const body = el("div", { class: "doc-body prose", tabindex: "0", role: "region", "aria-label": title || t("docs") }, markdown(content || "", anchors));
  const first = body.firstElementChild;
  if (first && /^H[23]$/.test(first.tagName) && first.textContent.trim() === String(title || "").trim()) { first.remove(); anchors.shift(); }
  return { body, anchors };
}
async function showDocument(open, back, focus) {
  // `focus` says where the keyboard goes once the page is up: "switch" after a change of
  // release, "title" when a row of a listing was opened, nowhere when Claude opened the page.
  const turn = ++state.turn;
  const pick = (r) => showDocument({ ...open, release: r, id: String(open.id).replace(/^[a-z]+:/, r + ":"), url: "" }, back, "switch");
  const head = el("header", { class: "head" },
    el("div", { class: "head-text" }, title(open.title || t("docs")),
      countLine([areaName(open.product), t("fromDocs", NAME[open.release] || open.release || "")].filter(Boolean).join(", "), open.release, pick)));
  const acts = el("div", { class: "acts doc-acts" }, back ? el("button", { class: "act", type: "button", text: t("back"), onclick: back }) : null, openButton(open.url));
  acts.hidden = !acts.children.length;
  const article = el("article", { class: "doc", "aria-busy": "true" }, el("p", { class: "state" }, el("span", { class: "pulse", "aria-hidden": "true" }), t("loadingPage")));
  app.replaceChildren(head, acts, article);
  if (focus === "switch") focusSwitch(); else if (focus) focusOn(head.querySelector("h1"));
  say(t("loadingPage"));
  const result = await callTool("snow_docs_read", { id: open.id, max_chars: 100000 });
  if (turn !== state.turn) return; // another page was asked for meanwhile
  article.removeAttribute("aria-busy");
  if (!result.ok) { article.replaceChildren(el("p", { class: "notice", role: "alert", text: result.message || t("failed") })); return; }
  // The page's own address comes with its text: a page opened from a listing, or in the
  // other release, has none until now.
  const link = !WEB.test(String(open.url || "")) && openButton(result.url);
  if (link) { acts.append(link); acts.hidden = false; }
  const { body, anchors } = documentBody(result.content, open.title);
  const parts = [];
  if (anchors.length > 2) {
    const go = (a) => (e) => { e.preventDefault(); const h = document.getElementById(a.id); if (h) { h.scrollIntoView({ block: "start", behavior: "smooth" }); h.focus({ preventScroll: true }); } };
    parts.push(el("nav", { class: "toc", "aria-label": t("onThisPage") }, el("h2", { text: t("onThisPage") }),
      el("ul", {}, anchors.map((a) => el("li", { class: a.level > 2 ? "sub" : "" }, el("a", { href: "#" + a.id, text: a.text, onclick: go(a) }))))));
  }
  parts.push(body);
  if (result.truncated) parts.push(el("p", { class: "reader-note", text: t("cut") }));
  article.replaceChildren(...parts);
  article.classList.toggle("with-toc", anchors.length > 2);
  const wanted = crumbsOf(open.focus).pop();
  const target = wanted && anchors.find((a) => a.text.trim() === wanted.trim());
  const heading = target && document.getElementById(target.id);
  if (heading) heading.scrollIntoView({ block: "start" });
  say(open.title || t("docs"));
}

// ---- browsing the docs as a tree ---------------------------------------------------------
function showBrowse(result, focusId) {
  // `listing` is this folder as it stands on the screen: it grows as more pages are fetched,
  // and it is what Back returns to, at the row that was opened.
  const listing = { ...result, pages: [...(result.pages || [])] };
  const path = String(result.path || ""), crumbs = path ? path.split("/") : [];
  let going = false;
  const warn = (text) => { for (const old of app.querySelectorAll(".notice")) old.remove(); app.querySelector(".head").after(el("p", { class: "notice", role: "alert", text })); };
  const go = async (args) => {
    if (going) return;
    going = true; say(t("opening"));
    const next = await callTool("snow_docs_browse", { release: result.release, ...args });
    going = false;
    if (next.ok) showBrowse(next, null); else warn(next.message || t("failed"));
  };
  const trail = el("nav", { class: "trail", "aria-label": t("docs") }, el("button", { type: "button", text: t("docs"), onclick: () => go({}) }));
  crumbs.forEach((c, n) => {
    trail.append(el("span", { class: "sep", "aria-hidden": "true", text: "/" }));
    const here = n === crumbs.length - 1;
    trail.append(here ? el("span", { "aria-current": "page", text: areaName(c) }) : el("button", { type: "button", text: areaName(c), onclick: () => go({ folder: crumbs.slice(0, n + 1).join("/") }) }));
  });
  const folders = result.folders || [];
  const total = listing.pages.length + (listing.pages_left_out || 0);
  const count = [folders.length ? t("nFolders", folders.length) : "", total ? t("nPages", total) : "", t("fromDocs", NAME[result.release] || result.release)].filter(Boolean).join(", ");
  const name = crumbs.length ? areaName(crumbs[crumbs.length - 1]) : t("areas");
  const head = el("header", { class: "head" }, el("div", { class: "head-text" }, title(name), el("p", { class: "count", text: count })));
  const parts = [head, trail];
  if (folders.length) {
    parts.push(el("section", { class: "part" }, path ? el("h2", { text: t("folders") }) : null, el("ul", { class: "rows" }, folders.map((f) =>
      el("li", {}, el("button", { type: "button", class: "row", onclick: () => go({ folder: f.path }) },
        el("span", { class: "row-name", text: areaName(f.name) }), el("span", { class: "row-count", text: t("nPages", f.pages) })))))));
  }
  const rowOf = new Map();
  if (listing.pages.length) {
    const list = el("ul", { class: "rows" });
    const add = (items) => items.map((pg) => {
      const row = el("button", { type: "button", class: "row",
        onclick: () => showDocument({ id: pg.id, title: pg.title, release: result.release, product: crumbs[0] || "", url: "" }, () => showBrowse(listing, pg.id), "title") },
        el("span", { class: "row-name", text: pg.title }));
      rowOf.set(pg.id, row); list.append(el("li", {}, row));
      return row;
    });
    add(listing.pages);
    const section = el("section", { class: "part" }, el("h2", { text: t("pages") }), list);
    if (listing.pages_left_out) {
      const more = el("button", { class: "act", type: "button", text: t("more", Math.min(listing.pages_left_out, 100)) });
      const acts = el("div", { class: "acts" }, more);
      more.addEventListener("click", async () => {
        if (more.hasAttribute("aria-busy")) return;
        more.setAttribute("aria-busy", "true");
        const next = await callTool("snow_docs_browse", { release: result.release, folder: path, offset: (result.offset || 0) + listing.pages.length });
        more.removeAttribute("aria-busy");
        if (!next.ok) return warn(next.message || t("moreFailed"));
        const fresh = next.pages || [];
        listing.pages.push(...fresh); listing.pages_left_out = fresh.length ? next.pages_left_out || 0 : 0;
        const rows = add(fresh);
        if (listing.pages_left_out) more.textContent = t("more", Math.min(listing.pages_left_out, 100)); else acts.remove();
        focusOn(rows[0] || (listing.pages_left_out ? more : list.lastElementChild && list.lastElementChild.firstElementChild)); // the first new row
      });
      section.append(acts);
    }
    parts.push(section);
  }
  app.replaceChildren(...parts);
  if (focusId !== undefined) focusOn(rowOf.get(focusId) || head.querySelector("h1"));
  say(name + ", " + count);
}

function show(result) {
  if (!result || result.ok === false) return message(t("failed"), (result && result.message) || "");
  if (Array.isArray(result.steps) && "mermaid" in result) return showDiagram(result);
  if (Array.isArray(result.headings) && "focus" in result) return showDocument(result);
  if (Array.isArray(result.folders) && "path" in result) return showBrowse(result);
  if (Array.isArray(result.hits)) return showSearch(result);
  if ("changed_pages" in result || "release_notes" in result) return showCompare(result);
  message(t("failed"));
}

// ---- start -------------------------------------------------------------------------------
async function start() {
  if (!hosted) return message(t("outside"), t("outsideHint"));
  let init = {};
  try {
    init = await request("ui/initialize", {
      protocolVersion: "2026-01-26",
      appInfo: { name: "servicenow-docs-panel", version: "1.0.0" },
      appCapabilities: { availableDisplayModes: ["inline"] },
    });
  } catch { /* an older host: carry on with the defaults */ }
  useContext((init && init.hostContext) || {});
  notify("ui/notifications/initialized");
  busy();
  // The size the content needs, not the size the frame has: the frame can then shrink again
  // when a section is hidden. Said once per change.
  let last = "";
  new ResizeObserver(() => {
    const size = { width: Math.ceil(window.innerWidth), height: Math.ceil(document.body.getBoundingClientRect().height) };
    if (size.width + "x" + size.height === last) return;
    last = size.width + "x" + size.height;
    notify("ui/notifications/size-changed", size);
  }).observe(document.body);
}
start();
})();
</script>
