<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ServiceNow Docs</title>
<style>
/* One self-contained page: the host's sandbox allows nothing external. Colors and type come
   from the host's standard variables when it sends them; the values here are the fallback.

   Type: three sizes for text (12 meta, 14 secondary, 16 body) and one for the title (20),
   three weights (400, 500, 600). Space: a 4/8 grid (4, 8, 12, 16, 24, 32). Nothing is there
   for decoration: color appears only where it tells the two releases apart. */
:root {
  color-scheme: light dark;
  --bg: var(--color-background-primary, light-dark(#ffffff, #1f1e1d));
  --bg-quiet: var(--color-background-secondary, light-dark(#f6f5f1, #282725));
  --ink: var(--color-text-primary, light-dark(#1b1b19, #f2f1ed));
  --ink-2: var(--color-text-secondary, light-dark(#5c5b56, #b4b2aa));
  --line: var(--color-border-primary, light-dark(#e3e1da, #3b3a36));
  --ring: var(--color-ring-primary, light-dark(#1f6feb, #8ab4ff));
  --sans: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
  --mono: var(--font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace);
  /* Text quoted from the docs is set in a reading face, so source and interface never blur. */
  --serif: "Iowan Old Style", Charter, "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  /* The two releases keep one color each, in the comparison only. */
  --au: light-dark(#8a5300, #efb35c);
  --au-wash: light-dark(#fbefd9, #3a2c12);
  --br: light-dark(#136c3b, #7ad39b);
  --br-wash: light-dark(#e0f4e7, #15331f);
  --radius: var(--border-radius-md, 8px);
  --radius-sm: var(--border-radius-sm, 6px);
  --meta: 0.75rem; --secondary: 0.875rem; --body: 1rem; --title: 1.25rem;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s6: 24px; --s8: 32px;
  --prose: 68ch;
}
* { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; padding: var(--s4) var(--s6) var(--s6);
  background: var(--bg); color: var(--ink);
  font: 400 var(--body)/1.55 var(--sans); font-feature-settings: "kern", "liga", "calt";
  text-rendering: optimizeLegibility; overflow-wrap: break-word;
}
h1, h2, h3, h4, p, ol, ul, blockquote { margin: 0; padding: 0; }
ol, ul { list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: var(--radius-sm); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Head: what was asked, how much came back, and which release it is from. */
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--s3) var(--s6);
  padding-bottom: var(--s4); border-bottom: 1px solid var(--line); }
.head-text { flex: 1 1 16rem; min-width: 0; }
.head h1 { font: 600 var(--title)/1.2 var(--sans); text-wrap: balance; }
.head .count { margin-top: var(--s1); color: var(--ink-2); font-size: var(--secondary); line-height: 1.4; }
.switch { display: inline-flex; padding: 2px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-quiet); }
.switch label { position: relative; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { display: block; padding: var(--s1) var(--s3); border-radius: var(--radius-sm); font-size: var(--secondary); font-weight: 500; line-height: 1.4; color: var(--ink-2); }
.switch input:checked + span { background: var(--bg); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.switch input:focus-visible + span { outline: 2px solid var(--ring); outline-offset: 2px; }
.switch input:disabled + span { opacity: 0.55; }
.legend { display: flex; gap: var(--s4); color: var(--ink-2); font-size: var(--secondary); line-height: 1.4; }
.key { display: inline-block; width: 8px; height: 8px; margin-right: var(--s2); border-radius: 2px; }
.key.australia { background: var(--au); } .key.brazil { background: var(--br); }

/* Entries: one ranked list, best match first. The number is the rank. */
.entries > li { display: grid; grid-template-columns: var(--s8) minmax(0, 1fr); column-gap: var(--s2);
  padding: var(--s6) 0; border-bottom: 1px solid var(--line); }
.entries > li > * { grid-column: 2; }
/* The rank is set at the title size and shares the entry title's line, so the list reads by number. */
.entries .rank { grid-column: 1; grid-row: 1; color: var(--ink-2); font: 500 var(--title)/1.25rem var(--sans); font-variant-numeric: tabular-nums; }
.entries.plain > li { grid-template-columns: minmax(0, 1fr); } .entries.plain > li > * { grid-column: 1; }
.entry h2, .entry h3 { font: 600 var(--body)/1.25 var(--sans); }
.where { margin-top: var(--s1); color: var(--ink-2); font-size: var(--secondary); line-height: 1.4; }
.where .sep { margin: 0 var(--s2); }
.quote { margin-top: var(--s2); max-width: var(--prose); font: 400 var(--body)/1.55 var(--serif); }
.acts { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s4); }
.act { min-height: 32px; padding: var(--s1) var(--s3); border: 1px solid var(--line); border-radius: var(--radius-sm);
  font-size: var(--secondary); font-weight: 500; line-height: 1.4; }
.act:hover { background: var(--bg-quiet); }
.act[aria-expanded="true"] { background: var(--bg-quiet); border-color: var(--ink-2); }
.act[disabled] { opacity: 0.55; cursor: progress; }

/* Reader: the full section, opened in place. */
.reader { margin-top: var(--s4); border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-quiet); }
.reader-body { max-height: 28rem; overflow: auto; padding: var(--s4) var(--s6); font: 400 var(--body)/1.55 var(--serif); }
.reader-body > * + * { margin-top: var(--s3); }
.reader-body h3, .reader-body h4 { font: 600 var(--body)/1.25 var(--sans); margin-top: var(--s6); }
.reader-body p, .reader-body li { max-width: var(--prose); }
.reader-body ul, .reader-body ol { padding-left: var(--s6); } .reader-body ul { list-style: disc; } .reader-body ol { list-style: decimal; }
.reader-body li + li { margin-top: var(--s1); }
.reader-body code { font: var(--secondary)/1.4 var(--mono); padding: 1px var(--s1); border-radius: 4px; background: color-mix(in oklab, var(--ink) 9%, transparent); }
.reader-body pre { overflow: auto; padding: var(--s3) var(--s4); border-radius: var(--radius-sm); background: color-mix(in oklab, var(--ink) 8%, transparent); font: var(--secondary)/1.5 var(--mono); }
.reader-body pre code { padding: 0; background: none; }
.reader-body table { border-collapse: collapse; font: var(--secondary)/1.5 var(--sans); width: 100%; }
.reader-body th, .reader-body td { padding: var(--s2) var(--s3); border: 1px solid var(--line); text-align: left; vertical-align: top; }
.reader-body th { font-weight: 600; background: color-mix(in oklab, var(--ink) 5%, transparent); }
.reader-body a { color: inherit; text-decoration: underline; text-decoration-color: var(--ink-2); text-underline-offset: 2px; }
.reader-note { padding: var(--s2) var(--s6); border-top: 1px solid var(--line); color: var(--ink-2); font-size: var(--secondary); }

/* Compare: Australia beside Brazil, the words that differ marked in each. */
.part { margin-top: var(--s8); }
.part > h2 { font: 600 var(--secondary)/1.4 var(--sans); color: var(--ink-2); padding-bottom: var(--s2); border-bottom: 1px solid var(--line); }
.page { padding: var(--s6) 0; border-bottom: 1px solid var(--line); }
.page > h3 { font: 600 var(--body)/1.25 var(--sans); }
.change { margin-top: var(--s6); }
.change-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s2); }
.change-head h4 { font: 500 var(--secondary)/1.4 var(--sans); }
.kind { font-size: var(--secondary); line-height: 1.4; color: var(--ink-2); }
.kind.added { color: var(--br); } .kind.removed { color: var(--au); }
.sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: var(--s4); margin-top: var(--s2); }
.side { border: 1px solid var(--line); border-radius: var(--radius); }
.side .rel { display: block; padding: var(--s2) var(--s4); border-bottom: 1px solid var(--line); font: 500 var(--meta)/1.4 var(--sans); color: var(--ink-2); }
.side p { padding: var(--s3) var(--s4) var(--s4); font: 400 var(--body)/1.55 var(--serif); }
del, ins { text-decoration: none; border-radius: 3px; padding: 0 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
del { background: var(--au-wash); color: var(--au); } ins { background: var(--br-wash); color: var(--br); }
.names { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s3); }
.foot { margin-top: var(--s4); color: var(--ink-2); font-size: var(--secondary); line-height: 1.4; }
.foot p + p { margin-top: var(--s1); }

/* Notes in the docs, and tables wider than the column */
.callout { padding: var(--s3) var(--s4); border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--bg-quiet); max-width: var(--prose); }
.callout strong { display: block; font: 600 var(--secondary)/1.4 var(--sans); margin-bottom: var(--s1); }
.table-wrap { overflow-x: auto; }
.flow-of { margin-top: var(--s2); }

/* A page as a document: the text in a reading column, its sections listed beside it. */
.doc-acts { margin-top: var(--s4); }
.doc { margin-top: var(--s4); }
.doc.with-toc { display: grid; grid-template-columns: minmax(0, 1fr) 14rem; gap: var(--s8); align-items: start; }
.doc.with-toc .toc { grid-column: 2; grid-row: 1; position: sticky; top: var(--s4); max-height: calc(100vh - var(--s8)); overflow: auto; }
.doc.with-toc .doc-body { grid-column: 1; grid-row: 1; }
.toc h2 { font: 600 var(--secondary)/1.4 var(--sans); color: var(--ink-2); margin-bottom: var(--s2); }
.toc li { font-size: var(--secondary); line-height: 1.4; } .toc li + li { margin-top: var(--s2); } .toc li.sub { padding-left: var(--s3); }
.toc a { color: var(--ink-2); text-decoration: none; } .toc a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
.doc-body { font: 400 var(--body)/1.55 var(--serif); min-width: 0; }
.doc-body > * + * { margin-top: var(--s3); }
.doc-body h3 { font: 600 var(--title)/1.2 var(--sans); margin-top: var(--s8); scroll-margin-top: var(--s4); }
.doc-body h4 { font: 600 var(--body)/1.25 var(--sans); margin-top: var(--s6); scroll-margin-top: var(--s4); }
.doc-body > h3:first-child, .doc-body > h4:first-child { margin-top: 0; }
.doc-body p, .doc-body li { max-width: var(--prose); }
.doc-body ul, .doc-body ol { padding-left: var(--s6); } .doc-body ul { list-style: disc; } .doc-body ol { list-style: decimal; }
.doc-body li + li { margin-top: var(--s2); } .doc-body li > * + * { margin-top: var(--s2); }
.doc-body code { font: var(--secondary)/1.4 var(--mono); padding: 1px var(--s1); border-radius: 4px; background: color-mix(in oklab, var(--ink) 9%, transparent); }
.doc-body pre { overflow: auto; padding: var(--s3) var(--s4); border-radius: var(--radius-sm); background: var(--bg-quiet); border: 1px solid var(--line); font: var(--secondary)/1.5 var(--mono); }
.doc-body pre code { padding: 0; background: none; }
.doc-body table { border-collapse: collapse; font: var(--secondary)/1.5 var(--sans); width: 100%; }
.doc-body th, .doc-body td { padding: var(--s2) var(--s3); border: 1px solid var(--line); text-align: left; vertical-align: top; }
.doc-body th { font-weight: 600; background: var(--bg-quiet); }
.doc-body a { color: inherit; text-decoration: underline; text-decoration-color: var(--ink-2); text-underline-offset: 2px; }

/* Browsing: where you are, then folders and pages as rows. */
.trail { display: flex; flex-wrap: wrap; align-items: baseline; margin-top: var(--s4); color: var(--ink-2); font-size: var(--secondary); line-height: 1.4; }
.trail button { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.trail button:hover { color: var(--ink); text-decoration-color: var(--ink-2); }
.trail .sep { margin: 0 var(--s2); } .trail [aria-current] { color: var(--ink); }
.rows > li { border-bottom: 1px solid var(--line); }
.row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s4); width: 100%; min-height: 40px; padding: var(--s2) 0; }
.row:hover .row-name { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--ink-2); }
.row-count { flex: none; color: var(--ink-2); font-size: var(--secondary); font-variant-numeric: tabular-nums; }

/* Diagrams: neutral boxes and lines; the shape says what kind of step it is. */
.chart-wrap { margin: var(--s4) 0 0; overflow-x: auto; }
.chart { display: block; max-width: none; height: auto; font: 400 var(--secondary) var(--sans); }
.chart .node rect, .chart .node polygon { fill: var(--bg-quiet); stroke: var(--ink-2); stroke-width: 1; }
.chart .node.start rect, .chart .node.end rect { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.chart .node text { fill: var(--ink); }
.chart .node[role="button"] { cursor: pointer; }
.chart .node[role="button"]:hover rect, .chart .node[role="button"]:hover polygon { stroke: var(--ink); }
.chart .node:focus-visible { outline: none; } .chart .node:focus-visible rect, .chart .node:focus-visible polygon { stroke: var(--ring); stroke-width: 2; }
.chart .link { fill: none; stroke: var(--ink-2); stroke-width: 1.25; }
.chart .tip { fill: var(--ink-2); }
.chart .link-name { fill: var(--ink-2); font-size: var(--meta); }
.chart .lane-name { fill: var(--ink-2); font-weight: 500; }
.chart .lane-line { stroke: var(--line); stroke-width: 1; }
.entry[tabindex]:focus-visible { outline-offset: 4px; }

/* States */
.state { padding: var(--s6) 0; color: var(--ink-2); font-size: var(--secondary); }
.state strong { display: block; color: var(--ink); font-size: var(--body); font-weight: 600; margin-bottom: var(--s1); }
.notice { margin-top: var(--s3); padding: var(--s2) var(--s3); border-radius: var(--radius-sm); background: var(--bg-quiet); border: 1px solid var(--line); font-size: var(--secondary); }
.pulse { display: inline-block; width: 8px; height: 8px; margin-right: var(--s2); border-radius: 50%; background: var(--ink-2); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }
@media (max-width: 44rem) { .doc.with-toc { display: block; } .doc.with-toc .toc { position: static; max-height: none; margin-bottom: var(--s6); padding-bottom: var(--s4); border-bottom: 1px solid var(--line); } }
@media (max-width: 30rem) { body { padding: var(--s3) var(--s4) var(--s4); } .entries > li { grid-template-columns: minmax(0, 1fr); } .entries > li > *, .entries .rank { grid-column: 1; grid-row: auto; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } * { scroll-behavior: auto !important; } }
@media (forced-colors: active) { .key { forced-color-adjust: none; } .act, .side, .reader { border-color: CanvasText; } }
</style>
</head>
<body>
<main id="app"></main>
<div id="live" class="sr" role="status" aria-live="polite"></div>
<script>
(() => {
"use strict";

// ---- words -------------------------------------------------------------------------------
const WORDS = {
  en: {
    searching: "Searching the docs…", comparing: "Comparing Australia and Brazil…", reading: "Reading…",
    passages: (n) => (n === 1 ? "1 passage" : n + " passages"), fromDocs: (r) => "from the " + r + " docs",
    snapshot: (d) => "snapshot " + d, release: "Release", read: "Read section", hide: "Hide section",
    open: "Open docs", readPage: "Read page", noHits: "No passages matched", tryOther: "Try other words, or search without a product area.",

    linkBlocked: (u) => "Could not open the link. Copy it: " + u, outside: "ServiceNow Docs",
    outsideHint: "This panel shows search results when Claude uses the ServiceNow docs tools.",
    whatChanged: "What changed from Australia to Brazil", notes: "Release notes", moreNotes: "More release notes by name",

    onThisPage: "On this page", back: "Back", docs: "Docs", areas: "Product areas", folders: "Folders", pages: "Pages",
    nFolders: (n) => (n === 1 ? "1 folder" : n + " folders"), nPages: (n) => (n === 1 ? "1 page" : n + " pages"),
    more: (n) => "Show " + n + " more", showFlow: "Show as flow", hideFlow: "Hide flow", stepsTitle: "Steps",
    nSteps: (n) => (n === 1 ? "1 step" : n + " steps"), inLanes: (n) => "in " + n + " lanes", leadsTo: "Then", source: "Read source",
    start: "Start", end: "End", decision: "Decision", flowOf: (s) => "Flow: " + s, loadingPage: "Opening the page…",
  },
  nb: {

    outsideHint: "Dette panelet viser søketreff når Claude bruker verktøyene for ServiceNow-dokumentasjonen.",
    whatChanged: "Hva som er endret fra Australia til Brazil", notes: "Release notes", moreNotes: "Flere release notes etter navn",
    changedDocs: "Endret i dokumentasjonen", noChanges: "Ingen endringer funnet i dokumentasjonssidene om dette temaet.",
    added: "Lagt til", removed: "Fjernet", changed: "Endret", small: (n) => (n === 1 ? "1 liten omskriving er ikke listet." : n + " små omskrivinger er ikke listet."),
    leftOut: (n) => (n === 1 ? "1 seksjon til vises ikke." : n + " seksjoner til vises ikke."),
    onlyIn: (r, n) => (n === 1 ? "1 side finnes bare i dokumentasjonen for " + r + "." : n + " sider finnes bare i dokumentasjonen for " + r + "."),
    readIn: (r) => "Les i " + r, sectionOf: (s) => "Seksjon: " + s,
    onThisPage: "På denne siden", back: "Tilbake", docs: "Dokumentasjon", areas: "Produktområder", folders: "Mapper", pages: "Sider",
    nFolders: (n) => (n === 1 ? "1 mappe" : n + " mapper"), nPages: (n) => (n === 1 ? "1 side" : n + " sider"),
    more: (n) => "Vis " + n + " til", showFlow: "Vis som flyt", hideFlow: "Skjul flyten", stepsTitle: "Steg",
    nSteps: (n) => n + " steg", inLanes: (n) => "i " + n + " baner", leadsTo: "Deretter", source: "Les kilden",
    start: "Start", end: "Slutt", decision: "Valg", flowOf: (s) => "Flyt: " + s, loadingPage: "Åpner siden…",
  },
};
let lang = "en";
const t = (key, ...args) => { const w = WORDS[lang][key] ?? WORDS.en[key]; return typeof w === "function" ? w(...args) : w; };
const RELEASES = ["australia", "brazil"];
const NAME = { australia: "Australia", brazil: "Brazil" };

// ---- small DOM helpers (text only: nothing from a tool result is ever parsed as markup) ----
const app = document.getElementById("app");
const live = document.getElementById("live");
function el(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) node.append(kid);
  return node;
}
const say = (text) => { live.textContent = ""; requestAnimationFrame(() => { live.textContent = text; }); };
const sentence = (text) => { const s = String(text || "").trim(); return s ? s[0].toUpperCase() + s.slice(1) : s; };
function day(iso) {
  const d = new Date(iso + "T00:00:00");
  if (Number.isNaN(d.getTime())) return iso;
  return new Intl.DateTimeFormat(lang === "nb" ? "nb-NO" : "en-GB", { day: "numeric", month: "short", year: "numeric" }).format(d);
}
const ACRONYMS = { it: "IT", hr: "HR", csm: "CSM", cmdb: "CMDB", api: "API", ai: "AI", ui: "UI", grc: "GRC", itom: "ITOM", itsm: "ITSM",
  devops: "DevOps", sla: "SLA", ci: "CI", rest: "REST", sdk: "SDK", cli: "CLI", atf: "ATF", mid: "MID", sow: "SOW" };
const areaName = (folder) => /^delta-/.test(String(folder)) ? t("notes") : String(folder || "").split("-").filter(Boolean)

      for (const st of [...steps].sort((x, y) => x.row - y.row || x.order - y.order)) {
        while (taken.has(st.col + ":" + st.row)) { st.row++; moved = true; }
        taken.add(st.col + ":" + st.row);
      }
    }
    if (!moved) break;
  }
  const rows = [];
  steps.forEach((st) => { (rows[st.row] = rows[st.row] || []).push(st); });
  let cols = spec.lanes.length || 1;
  if (!spec.lanes.length) rows.forEach((r) => { cols = Math.max(cols, r.length); });
  const colX = (c) => PAD + W / 2 + c * (W + GAP_X);
  let y = PAD + HEAD;
  rows.forEach((r) => {
    if (!r) return;
    r.forEach((st, n) => {
      st.h = st.lines.length * LINE + (st.kind === "decision" ? 56 : 20);
      st.x = spec.lanes.length ? colX(st.col) : colX((cols - r.length) / 2 + n);
    });
    const tall = Math.max(...r.map((st) => st.h));
    r.forEach((st) => { st.y = y + tall / 2; });
    y += tall + GAP_Y;
  });
  const hasBack = links.some((l) => l.back);
  const width = PAD * 2 + cols * W + (cols - 1) * GAP_X + (hasBack ? 32 : 0), height = y - GAP_Y + PAD;
  const root = svg("svg", { viewBox: `0 0 ${width} ${height}`, width, height, role: "img", "aria-label": label, class: "chart" });
  root.append(svg("defs", {}, svg("marker", { id: "tip", viewBox: "0 0 10 10", refX: "9", refY: "5", markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse" },
    svg("path", { d: "M0 0 L10 5 L0 10 z", class: "tip" }))));
  spec.lanes.forEach((lane, n) => {
    const x = colX(n);
    if (n) root.append(svg("line", { x1: x - W / 2 - GAP_X / 2, y1: PAD, x2: x - W / 2 - GAP_X / 2, y2: height - PAD, class: "lane-line" }));
    const text = svg("text", { x, y: PAD + 16, class: "lane-name", "text-anchor": "middle" }); text.textContent = lane.label;
    root.append(text);
  });
  if (spec.lanes.length) root.append(svg("line", { x1: PAD, y1: PAD + HEAD - 8, x2: width - PAD, y2: PAD + HEAD - 8, class: "lane-line" }));
  let lap = 0;
  for (const l of links) {
    const a = byId.get(l.source), b = byId.get(l.target);
    let d, lx, ly, anchor = "start";
    if (l.back || b.row <= a.row) {
      // back up the page: out to the right edge and in from the right
      const edge = width - PAD - 8 - (lap++ % 3) * 6;
      d = `M${a.x + W / 2} ${a.y} H${edge} V${b.y} H${b.x + W / 2}`; lx = a.x + W / 2 + 6; ly = a.y - 6;
    } else if (b.row === a.row + 1) {
      // the next row: straight down, or down and across
      if (Math.abs(a.x - b.x) < 1) { d = `M${a.x} ${a.y + a.h / 2} V${b.y - b.h / 2}`; lx = a.x + 8; ly = a.y + a.h / 2 + 16; }
      else {
        const mid = b.y - b.h / 2 - GAP_Y / 2;
        d = `M${a.x} ${a.y + a.h / 2} V${mid} H${b.x} V${b.y - b.h / 2}`;
        // the name sits on the branch's own stretch, so two branches of one decision stay apart
        lx = b.x + (b.x > a.x ? -8 : 8); ly = mid - 6; anchor = b.x > a.x ? "end" : "start";
      }
    } else {
      // past other rows: leave from the side and run down the gap beside the column, so the
      // line never passes behind a step
      const dir = b.x > a.x + 1 ? 1 : -1;
      const gutter = a.x + dir * (W / 2 + 12 + (lap++ % 3) * 6);
      const into = b.x > gutter ? b.x - W / 2 : b.x + W / 2;
      d = Math.abs(gutter - b.x) < W / 2 - 8
        ? `M${a.x + dir * W / 2} ${a.y} H${gutter} V${b.y - b.h / 2}` // the gap is above the step: come in from the top
        : `M${a.x + dir * W / 2} ${a.y} H${gutter} V${b.y} H${into}`;
      lx = a.x + dir * (W / 2 + 4); ly = a.y - 6; anchor = dir > 0 ? "start" : "end";
    }
    root.append(svg("path", { d, class: "link", "marker-end": "url(#tip)" }));
    if (l.label) { const text = svg("text", { x: lx, y: ly, class: "link-name", "text-anchor": anchor }); text.textContent = l.label; root.append(text); }
  }
  for (const st of steps) {
    const g = svg("g", { class: "node " + st.kind });
    const left = st.x - W / 2, top = st.y - st.h / 2;
    if (st.kind === "decision") g.append(svg("polygon", { points: `${st.x},${top} ${left + W},${st.y} ${st.x},${top + st.h} ${left},${st.y}` }));
    else g.append(svg("rect", { x: left, y: top, width: W, height: st.h, rx: st.kind === "start" || st.kind === "end" ? st.h / 2 : 6 }));
    const text = svg("text", { x: st.x, y: st.y - ((st.lines.length - 1) * LINE) / 2 + 5, "text-anchor": "middle" });
    st.lines.forEach((line, n) => { const span = svg("tspan", { x: st.x, dy: n ? LINE : 0 }); span.textContent = line; text.append(span); });
    g.append(text);
    if (onPick) {
      g.setAttribute("tabindex", "0"); g.setAttribute("role", "button"); g.setAttribute("aria-label", st.label);
      g.addEventListener("click", () => onPick(st.id));
      g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onPick(st.id); } });
    }
    root.append(g);
  }
  return el("figure", { class: "chart-wrap" }, root);
}
function showDiagram(result) {
  const lanes = result.lanes || [], steps = result.steps || [], links = result.links || [];
  const count = [t("nSteps", steps.length), lanes.length ? t("inLanes", lanes.length) : ""].filter(Boolean).join(" ");
  const head = el("header", { class: "head" }, el("div", { class: "head-text" }, el("h1", { text: result.title || t("stepsTitle") }), el("p", { class: "count", text: count })));
  const items = new Map();
  const pick = (id) => { const li = items.get(id); if (!li) return; li.scrollIntoView({ block: "nearest", behavior: "smooth" }); const b = li.querySelector("button"); (b || li).focus({ preventScroll: true }); };
  const chart = diagram({ steps, links, lanes }, t("flowOf", result.title || ""), pick);
  const laneName = new Map(lanes.map((l) => [l.id, l.label]));
  const stepName = new Map(steps.map((st) => [st.id, st.label]));
  const outline = el("ol", { class: "entries" });
  steps.forEach((st, n) => {
    const li = el("li", { class: "entry", tabindex: "-1" }, el("span", { class: "rank", "aria-hidden": "true", text: String(n + 1) }), el("h3", { text: st.label }));
    const where = [st.kind !== "step" ? t(st.kind) : "", laneName.get(st.lane) || ""].filter(Boolean).join(", ");
    if (where) li.append(el("p", { class: "where", text: where }));
    if (st.detail) li.append(el("blockquote", { class: "quote", text: st.detail }));
    const next = links.filter((l) => l.source === st.id).map((l) => (l.label ? l.label + ": " : "") + (stepName.get(l.target) || l.target));
    if (next.length) li.append(el("p", { class: "where", text: t("leadsTo") + " " + next.join("; ") }));
    if (st.source_id) li.append(el("div", { class: "acts" }, readerButton(st.source_id, t("source"), li)));
    items.set(st.id, li); outline.append(li);
  });
  app.replaceChildren(head, chart, el("section", { class: "part" }, el("h2", { text: t("stepsTitle") }), outline));
  say(result.title || t("stepsTitle"));
}

// ---- a page as a document ----------------------------------------------------------------
async function showDocument(open, back) {
  const head = el("header", { class: "head" },
    el("div", { class: "head-text" }, el("h1", { text: open.title || t("docs") }),
      el("p", { class: "count", text: [areaName(open.product), t("fromDocs", NAME[open.release] || open.release || "")].filter(Boolean).join(", ") })),
    documentSwitch(open, back));
  const acts = el("div", { class: "acts doc-acts" }, back ? el("button", { class: "act", type: "button", text: t("back"), onclick: back }) : null, openButton(open.url));
  const article = el("article", { class: "doc", "aria-busy": "true" }, el("p", { class: "state" }, el("span", { class: "pulse", "aria-hidden": "true" }), t("loadingPage")));
  app.replaceChildren(head, acts, article);
  say(t("loadingPage"));
  let result;
  try { result = await callTool("snow_docs_read", { id: open.id, max_chars: 100000 }); } catch (e) { result = { ok: false, message: (e && e.message) || t("failed") }; }
  article.removeAttribute("aria-busy");
  if (!result.ok) { article.replaceChildren(el("p", { class: "notice", role: "alert", text: result.message || t("failed") })); return; }
  const anchors = [];
  const body = el("div", { class: "doc-body" }, markdown(result.content || "", anchors));
  const first = body.firstElementChild;
  if (first && /^H[34]$/.test(first.tagName) && first.textContent.trim() === String(open.title || "").trim()) { first.remove(); anchors.shift(); }
  const parts = [];
  if (anchors.length > 2) {
    const nav = el("nav", { class: "toc", "aria-label": t("onThisPage") }, el("h2", { text: t("onThisPage") }),
      el("ul", {}, anchors.map((a) => el("li", { class: a.level > 2 ? "sub" : "" },
        el("a", { href: "#" + a.id, text: a.text, onclick: (e) => { e.preventDefault(); const h = document.getElementById(a.id); h.scrollIntoView({ block: "start", behavior: "smooth" }); h.focus({ preventScroll: true }); } })))));
    parts.push(nav);
  }
  parts.push(body);
  if (result.truncated) parts.push(el("p", { class: "reader-note", text: t("cut") }));
  article.replaceChildren(...parts);
  article.classList.toggle("with-toc", anchors.length > 2);
  const focus = String(open.focus || "").split(" > ").pop().replace(/\\(.)/g, "$1");
  const target = focus && anchors.find((a) => a.text.trim() === focus.trim());
  if (target) document.getElementById(target.id).scrollIntoView({ block: "start" });
  say(open.title || t("docs"));
}
function documentSwitch(open, back) {
  const group = el("div", { class: "switch", role: "radiogroup", "aria-label": t("release") });
  for (const r of RELEASES) {
    const input = el("input", { type: "radio", name: "doc-release", value: r, checked: r === open.release });
    input.addEventListener("change", () => showDocument({ ...open, release: r, id: String(open.id).replace(/^[a-z]+:/, r + ":"), url: "" }, back));
    group.append(el("label", {}, input, el("span", { text: NAME[r] })));
  }
  return group;
}

// ---- browsing the docs as a tree ---------------------------------------------------------
function showBrowse(result) {
  const path = String(result.path || ""), crumbs = path ? path.split("/") : [];
  const go = async (args) => {
    say(t("searching"));
    let next;
    try { next = await callTool("snow_docs_browse", { release: result.release, ...args }); } catch (e) { next = { ok: false, message: (e && e.message) || t("failed") }; }
    if (next.ok) showBrowse(next); else app.querySelector(".head").after(el("p", { class: "notice", role: "alert", text: next.message || t("failed") }));
  };
  const trail = el("nav", { class: "trail", "aria-label": t("docs") }, el("button", { type: "button", text: t("docs"), onclick: () => go({}) }));
  crumbs.forEach((c, n) => {
    trail.append(el("span", { class: "sep", "aria-hidden": "true", text: "/" }));
    const here = n === crumbs.length - 1;
    trail.append(here ? el("span", { "aria-current": "page", text: areaName(c) }) : el("button", { type: "button", text: areaName(c), onclick: () => go({ folder: crumbs.slice(0, n + 1).join("/") }) }));
  });
  const folders = result.folders || [], pages = result.pages || [];
  const total = pages.length + (result.pages_left_out || 0);
  const count = [folders.length ? t(path ? "nFolders" : "nFolders", folders.length) : "", total ? t("nPages", total) : "", t("fromDocs", NAME[result.release] || result.release)].filter(Boolean).join(", ");
  const title = crumbs.length ? areaName(crumbs[crumbs.length - 1]) : t("areas");
  const head = el("header", { class: "head" }, el("div", { class: "head-text" }, el("h1", { text: title }), el("p", { class: "count", text: count })));
  const parts = [head, trail];
  if (folders.length) {
    parts.push(el("section", { class: "part" }, path ? el("h2", { text: t("folders") }) : null, el("ul", { class: "rows" }, folders.map((f) =>
      el("li", {}, el("button", { type: "button", class: "row", onclick: () => go({ folder: f.path }) },
        el("span", { class: "row-name", text: areaName(f.name) }), el("span", { class: "row-count", text: t("nPages", f.pages) })))))));
  }
  if (pages.length) {
    const list = el("ul", { class: "rows" });
    const add = (items) => items.forEach((pg) => list.append(el("li", {}, el("button", { type: "button", class: "row",
      onclick: () => showDocument({ id: pg.id, title: pg.title, release: result.release, product: crumbs[0] || "", url: "" }, () => showBrowse(result)) },
      el("span", { class: "row-name", text: pg.title })))));
    add(pages);
    const section = el("section", { class: "part" }, el("h2", { text: t("pages") }), list);
    let shown = pages.length, left = result.pages_left_out || 0;
    if (left) {
      const more = el("button", { class: "act", type: "button", text: t("more", Math.min(left, 100)) });
      more.addEventListener("click", async () => {
        more.disabled = true;
        let next;
        try { next = await callTool("snow_docs_browse", { release: result.release, folder: path, offset: (result.offset || 0) + shown }); } catch { next = { ok: false }; }
        if (next.ok) { add(next.pages || []); shown += (next.pages || []).length; left = next.pages_left_out || 0; }
        more.disabled = false;
        if (left) more.textContent = t("more", Math.min(left, 100)); else more.remove();
      });
      section.append(el("div", { class: "acts" }, more));
    }
    parts.push(section);
  }
  app.replaceChildren(...parts);
  say(title + ", " + count);
}

function show(result) {
  if (!result || result.ok === false) return message(t("failed"), (result && result.message) || "");
  if (Array.isArray(result.steps) && "mermaid" in result) return showDiagram(result);
  if (Array.isArray(result.headings) && "focus" in result) return showDocument(result);
  if (Array.isArray(result.folders) && "path" in result) return showBrowse(result);
  if (Array.isArray(result.hits)) { state.view = "search"; return showSearch(result); }
  if ("changed_pages" in result || "release_notes" in result) { state.view = "compare"; return showCompare(result); }
  message(t("failed"));
}

// ---- start -------------------------------------------------------------------------------
async function start() {
  if (!hosted) return message(t("outside"), t("outsideHint"));
  let init = {};
  try {
    init = await request("ui/initialize", {
      protocolVersion: "2026-01-26",
      appInfo: { name: "servicenow-docs-panel", version: "1.0.0" },
      appCapabilities: { availableDisplayModes: ["inline"] },
    });
  } catch { /* an older host: carry on with the defaults */ }
  useContext((init && init.hostContext) || {});
  notify("ui/notifications/initialized");
  busy();
  let frame = 0;
  new ResizeObserver(() => {
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(() => notify("ui/notifications/size-changed", {
      width: Math.ceil(document.documentElement.scrollWidth), height: Math.ceil(document.documentElement.scrollHeight),
    }));
  }).observe(document.body);
}
start();
})();
